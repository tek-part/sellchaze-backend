name: Deploy Backend

on:
  workflow_run:
    workflows: [Backend Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to the latest main that passed Quality)
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}

    steps:
      - name: Resolve commit and Quality run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -e
          if [ -n "$RUN_ID" ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"; echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Manual dispatch: latest successful Quality run on main (optionally for a given sha).
          if [ -n "$DEPLOY_SHA" ]; then
            row=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Backend Quality" --branch main --status success --commit "$DEPLOY_SHA" --limit 1 --json databaseId,headSha --jq '.[0]')
          else
            row=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Backend Quality" --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0]')
          fi
          test -n "$row" && [ "$row" != "null" ] || { echo "No successful Quality run found"; exit 1; }
          echo "run_id=$(echo "$row" | jq -r .databaseId)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$row" | jq -r .headSha)" >> "$GITHUB_OUTPUT"
      - name: Pin DEPLOY_SHA
        run: echo "DEPLOY_SHA=${{ steps.resolve.outputs.sha }}" >> "$GITHUB_ENV"
      # The host's brute-force protection (cPHulk) periodically locks SSH for everyone after
      # bots fail against root. Instead of failing the deploy, wait the lockout out: every SSH
      # step below retries for up to ~25 minutes. The host key is pinned to SSH_HOST_FINGERPRINT.
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # No probing loops: every unauthenticated connection (ssh-keyscan, banner probes) counts
          # as a failed login for cPHulk and re-arms the very lockout we would be waiting for.
          # Host key: trust-on-first-use per job; when SSH_HOST_FINGERPRINT is set, verify it once.
          touch ~/.ssh/known_hosts
          if [ -n "$SSH_FINGERPRINT" ]; then
            ssh-keyscan -T 20 -p 22 "$SSH_HOST" > ~/.ssh/scanned 2>/dev/null || true
            if [ -s ~/.ssh/scanned ]; then
              ssh-keygen -lf ~/.ssh/scanned | grep -qF "$SSH_FINGERPRINT" \
                || ssh-keygen -E md5 -lf ~/.ssh/scanned | grep -qF "$SSH_FINGERPRINT" \
                || { echo "Host key fingerprint mismatch"; ssh-keygen -lf ~/.ssh/scanned; exit 1; }
              cp ~/.ssh/scanned ~/.ssh/known_hosts
            fi
          fi
      - name: Deploy Backend to Production
        run: |
          set -e
          cat > remote.sh <<'REMOTE'
          set -e
          APP_DIR=/home/sellchaze/public_html/api.sellchaze.com
          PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php
          printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -x "$PHP_BIN"
          cd "$APP_DIR"
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/tek-part/sellchaze-backend.git
          fi
          git fetch --prune origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git reset --hard "$DEPLOY_SHA"
          "$PHP_BIN" /usr/local/bin/composer install --no-dev --optimize-autoloader
          "$PHP_BIN" artisan migrate --force
          # Register/refresh storefront theme manifests, then retire legacy themes (idempotent).
          "$PHP_BIN" artisan themes:register
          "$PHP_BIN" artisan themes:prune-legacy
          "$PHP_BIN" artisan optimize
          "$PHP_BIN" artisan queue:restart || true
          echo "Deployed $DEPLOY_SHA"
          REMOTE
          OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o ServerAliveInterval=15"
          # Retry only on SSH connection failures (exit 255), for ~25 minutes.
          for i in $(seq 1 30); do
            # Capture ssh's own exit status (after an `if` statement `$?` would be the if's, i.e. 0).
            if ssh $OPTS -p 22 "$SSH_USER@$SSH_HOST" DEPLOY_SHA="$DEPLOY_SHA" 'bash -s' < remote.sh; then
              exit 0
            else
              rc=$?
            fi
            [ "$rc" -eq 255 ] || exit "$rc"
            echo "attempt $i: connection failed — retrying in 120s"; sleep 120
          done
          echo "SSH never became available"; exit 1
