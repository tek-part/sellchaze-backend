name: Deploy Backend

on:
  workflow_run:
    workflows: [Backend Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Deploy Backend to Production
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: DEPLOY_SHA

          script: |
            set -e

            APP_DIR=/home/sellchaze/public_html/api.sellchaze.com
            PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php

            printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
            test -x "$PHP_BIN"

            cd "$APP_DIR"
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/tek-part/sellchaze-backend.git
            fi

            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"

            "$PHP_BIN" /usr/local/bin/composer install --no-dev --optimize-autoloader

            "$PHP_BIN" artisan migrate --force

            # Register/refresh storefront theme manifests (idempotent).
            "$PHP_BIN" artisan themes:register

            "$PHP_BIN" artisan optimize

            "$PHP_BIN" artisan queue:restart || true
